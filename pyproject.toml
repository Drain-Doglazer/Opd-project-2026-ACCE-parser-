[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.poetry]
package-mode = false

[project]
name = "acce-parser"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.10",
    "pandas>=2.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
acce-parse = "run_parser:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["acce_tools*"]
